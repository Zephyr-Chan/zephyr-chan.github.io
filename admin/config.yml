backend:
  name: github
  repo: Zephyr-Chan/zephyr-chan.github.io
  branch: main
  auth_endpoint: auth
  app_id: ""

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "zh"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"

collections:
  - name: "algo_templates"
    label: "算法模板"
    label_singular: "算法模板"
    folder: "content/algo-templates"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "category", label: "分类", widget: "select", options: ["DP 动态规划", "图论", "字符串", "数学", "数据结构", "贪心", "搜索", "其他"] }
      - { name: "difficulty", label: "难度", widget: "select", options: ["入门", "中等", "困难", "省选", "NOI"], required: false }
      - { name: "source", label: "题目来源", widget: "string", required: false }
      - { name: "code", label: "代码", widget: "code", default_language: "cpp", required: false }
      - { name: "body", label: "思路说明", widget: "markdown", required: false }
      - { name: "tags", label: "标签", widget: "list", required: false }
      - { name: "date", label: "发布日期", widget: "datetime", required: false }

  - name: "vp_notes"
    label: "VP 记录"
    label_singular: "VP 记录"
    folder: "content/vp-notes"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{contest}} — {{date}}"
    fields:
      - { name: "contest", label: "比赛名称", widget: "string" }
      - { name: "platform", label: "比赛平台", widget: "select", options: ["Codeforces", "AtCoder", "Luogu", "Nowcoder", "LeetCode", "GDCPC", "ICPC", "CCPC", "蓝桥杯", "其他"] }
      - { name: "date", label: "比赛日期", widget: "datetime" }
      - { name: "rating_change", label: "Rating 变化", widget: "string", required: false }
      - { name: "rank", label: "排名", widget: "string", required: false }
      - { name: "body", label: "VP 内容", widget: "markdown" }
      - { name: "tags", label: "标签", widget: "list", required: false }

  - name: "gallery_photos"
    label: "相册照片"
    label_singular: "相册照片"
    folder: "content/gallery"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{tag}}"
    fields:
      - { name: "title", label: "照片标题", widget: "string" }
      - { name: "image", label: "照片", widget: "image" }
      - { name: "description", label: "照片描述", widget: "string", required: false }
      - { name: "tag", label: "分类标签", widget: "select", options: ["会议", "实验室", "旅行", "获奖", "日常", "竞赛", "其他"] }
      - { name: "date", label: "拍摄日期", widget: "datetime", required: false }
      - { name: "weight", label: "排序权重 (0-100)", widget: "number", default: 50, required: false }

  - name: "learning_resources"
    label: "学习资料"
    label_singular: "学习资料"
    folder: "content/resources"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { name: "title", label: "资料名称", widget: "string" }
      - { name: "url", label: "资料链接", widget: "string" }
      - { name: "description", label: "简短描述", widget: "string", required: false }
      - { name: "category", label: "分类", widget: "select", options: ["深度学习", "论文阅读", "编程语言", "算法竞赛", "科研工具", "效率工具", "其他"] }
      - { name: "icon", label: "图标 (FontAwesome 类名)", widget: "string", required: false }
      - { name: "color", label: "卡片颜色 (十六进制)", widget: "string", required: false }

  - name: "friend_links"
    label: "友链"
    label_singular: "友链"
    folder: "content/friends"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}}"
    fields:
      - { name: "name", label: "友链名称", widget: "string" }
      - { name: "url", label: "网站地址", widget: "string" }
      - { name: "description", label: "一句话描述", widget: "string", required: false }
      - { name: "avatar", label: "头像", widget: "image", required: false }
      - { name: "avatar_color", label: "头像背景渐变色", widget: "string", required: false }
